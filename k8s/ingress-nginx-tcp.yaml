# Values for the ingress-nginx release (not for this chart). A Kubernetes
# Ingress only routes HTTP, so ingress-nginx's TCP proxy publishes INDI's
# port instead: <public port>: <namespace>/<service>:<service port>.
#
# Apply once, keeping the installed chart version (helm list -n ingress-nginx):
#
#   helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
#   helm upgrade ingress-nginx ingress-nginx/ingress-nginx -n ingress-nginx \
#     --version <installed chart version> --reuse-values -f k8s/ingress-nginx-tcp.yaml
tcp:
  "7624": indi/indi-server-simulator:7624
