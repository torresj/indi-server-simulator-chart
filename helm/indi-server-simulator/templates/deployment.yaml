apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "indi-server-simulator.fullname" . }}
  labels:
    {{- include "indi-server-simulator.labels" . | nindent 4 }}
spec:
  # The simulated devices live in the indiserver process, so a second replica
  # would show each client a different sky. Recreate also stops the old
  # server before the new one starts.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "indi-server-simulator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "indi-server-simulator.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- include "indi-server-simulator.args" . | nindent 12 }}
          ports:
            - name: indi
              containerPort: 7624
              protocol: TCP
          # Each probe connects as a client, so it shows in -v logs; keep
          # the periods long.
          readinessProbe:
            tcpSocket:
              port: indi
            periodSeconds: 20
          livenessProbe:
            tcpSocket:
              port: indi
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # Drivers keep their configuration in ~/.indi.
            - name: home
              mountPath: /home/indi
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
