apiVersion: v1
kind: Service
metadata:
  name: {{ include "indi-server-simulator.fullname" . }}
  labels:
    {{- include "indi-server-simulator.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: indi
      protocol: TCP
      name: indi
  selector:
    {{- include "indi-server-simulator.selectorLabels" . | nindent 4 }}
